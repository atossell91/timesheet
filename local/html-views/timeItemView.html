<!-- <link type="stylesheet" href="timeItem.css"/> -->
<div class="timeItem" data-name="id-root">
    <!-- Code here -->
     <div class="horz">
        <span class="horz">
            <div class="vert">
                <label>Work date:</label>
                <input type="date" placeholder="Work date" data-name="id-workDate"/>
            </div>
            <div class="vert">
                <label>Lunch taken:</label>
                <input type="checkbox" data-name="id-lunchBreak"/>
            </div>
            <div class="vert">
                <label>Lunch delivered:</label>
                <input type="checkbox" data-name="id-lunchDelivered"/>
            </div>
        </span>
        <span class="horz">
            <div class="vert">
                <label>Regular Hours worked</label>
                <label data-name="id-regularHours"></label>
            </div>
            <div class="vert">
                <label>Overtime Hours worked</label>
                <label data-name="id-overtimeHours"></label>
            </div>
            <div class="vert">
                <label>Total Hours worked</label>
                <label data-name="id-totalHours"></label>
            </div>
        </span>
     </div>
     <div>
        <div data-name="id-timeSlices">
            <thead>
                <tr>
                    <th>
                        Date
                    </th>
                    <th>
                        Response
                    </th>
                    <th>
                        Start Hour
                    </th>
                    <th>
                        Start Minutes
                    </th>
                    <th>
                        End Hour
                    </th>
                    <th>
                        End Minutes
                    </th>
                    <th>
                        Lunch Break
                    </th>
                    <th>
                        Lunch Delivered
                    </th>
                </tr>
            </thead>
            <tbody data-name="id-tableBody"></tbody>
        </div>
     </div>
     <div>
        <button data-name="id-addSlice">Add New Slice</button>
     </div>
</div>
