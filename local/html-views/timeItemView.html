<!-- <link type="stylesheet" href="timeItem.css"/> -->
<div class="timeItem" data-name="id-root">
    <!-- Code here -->
    <div class="horz line-bottom top-panel">
        <span class="horz-items left-panel">
            <div class="horz labelled-control">
                <div>
                    <label>Work date:</label>
                </div>
                <div>
                    <input type="date" placeholder="Work date" data-name="id-workDate"/>
                </div>
            </div>
        </span>
        <span class="horz-items right-panel">
            <div class="horz labelled-control">
                <div>
                    <label>Regular Hours worked</label>
                </div>
                <div>
                    <label data-name="id-regularHours"></label>
                </div>
            </div>
            <div class="horz labelled-control">
                <div>
                    <label>Overtime Hours worked</label>
                </div>
                <div>
                    <label data-name="id-overtimeHours"></label>
                </div>
            </div>
            <div class="horz labelled-control">
                <div>
                    <label>Total Hours worked</label>
                </div>
                <div>
                    <label data-name="id-totalHours"></label>
                </div>
            </div>
        </span>
    </div>
     <div>
        <div data-name="id-timeSlices" class="grid-section">
            <div class="grid-time" data-name="id-tableBody">
                <div>
                    Date
                </div>
                <div>
                    Response
                </div>
                <div>
                    Start Hour
                </div>
                <div>
                    Start Minutes
                </div>
                <div>
                    End Hour
                </div>
                <div>
                    End Minutes
                </div>
                <div>
                    Lunch Break
                </div>
                <div>
                    Lunch Delivered
                </div>
                <div><!-- Header for the delete button --></div>
            </div>
        </div>
     </div>
     <div>
        <button data-name="id-addSlice" class="hstretch vstretch">Add New Slice</button>
     </div>
</div>
