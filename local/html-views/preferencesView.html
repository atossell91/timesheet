<div class="preferences" data-name="id-root">
    <!-- Code here -->
     <div>
        <div>
            <div>
                <label>
                    Default Start Hour
                    <input type="number" data-name="id-defaultStartHour"/>
                </label>
            </div>
            <div>
                <label>
                    Default Start Minutes
                    <select data-name="id-defaultStartMinute">
                        <option value="00">00</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="45">45</option>
                    </select>
                </label>
            </div>
            <div>
                <label>
                    Default End Hour
                    <input type="number" data-name="id-defaultEndHour"/>
                </label>
            </div>
            <div>
                <label>
                    Default End Minutes
                    <select data-name="id-defaultEndMinute">
                        <option value="00">00</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="45">45</option>
                    </select>
                </label>
            </div>
            <div>
                <label>
                    Default Response
                    <select data-name="id-defaultResponse"></select>
                </label>
            </div>
            <div data-name="id-responseSpecifics"></div>
            <div>
                <button data-name="id-backButton">Back</button>
            </div>
        </div>
     </div>
</div>
