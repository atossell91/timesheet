<!-- <link type="stylesheet" href="timeItemRow.css"/> -->
<div class="timeItemRow" data-name="id-root">
    <div>
        <input type="date" data-name="id-timeSlotDate"/>
    </div>
    <div>
        <select data-name="id-response"></select>
    </div>
    <div>
        <input type="number" min=0 max=24 placeholder="08" data-name="id-startHour"/>
    </div>
    <div>
        <select data-name="id-startMinutes">
            <option value=0>00</option>
            <option value=15>15</option>
            <option value=30>30</option>
            <option value=45>45</option>
        </select>
    </div>
    <div>
        <input type="number" min=0 max=24 placeholder="16" data-name="id-endHour"/>
    </div>
    <div>
        <select data-name="id-endMinutes">
            <option value=0>00</option>
            <option value=15>15</option>
            <option value=30>30</option>
            <option value=45>45</option>
        </select>
    </div>
    <div>
        <input type="checkbox" data-name="id-lunchBreak"/>
    </div>
    <div>
        <input type="checkbox" data-name="id-lunchDelivered"/>
    </div>
    <div>
        <button data-name="id-deleteRow">DEL</button>
    </div>
</div>
